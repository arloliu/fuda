name: Bug report
description: Report unexpected or incorrect behavior in Fuda.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        A minimal struct definition and config snippet that reproduces the issue.
        This is usually enough — a runnable `go test` or `go run` snippet is even better.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fuda version
      description: Output of `go list -m github.com/arloliu/fuda` or the tag/commit you're on.
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, stack traces, or other context.
    validations:
      required: false
