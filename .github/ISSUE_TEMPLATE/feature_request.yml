name: Feature request
description: Suggest an idea or enhancement for Fuda.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case this feature would enable or the pain point it removes.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Sketch the struct tags, function signatures, or config format you have in mind.
      render: go
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, including workarounds you're using today.
    validations:
      required: false
