site_name: Fuda
site_description: Struct-tag-first configuration for Go.
site_url: https://arloliu.github.io/fuda/
repo_url: https://github.com/arloliu/fuda
repo_name: arloliu/fuda

theme:
  name: material
  language: en
  logo: assets/images/fuda-logo.png
  favicon: assets/images/fuda-logo.png
  features:
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Install Fuda: getting-started/install.md
      - Build your first configuration: getting-started/first-configuration.md
      - Choose a value: getting-started/choosing-a-value.md
  - Core concepts:
      - Configuration files: concepts/configuration-files.md
      - Defaults: concepts/defaults.md
      - Environment variables: concepts/environment-variables.md
      - Validation: concepts/validation.md
      - Data types: concepts/data-types.md
  - How-to guides:
      - Load a dotenv file: guides/dotenv.md
      - Load external references: guides/references.md
      - Compose a DSN: guides/dsn.md
      - Render a configuration template: guides/templates.md
      - Apply programmatic overrides: guides/overrides.md
      - Add dynamic defaults and custom conversions: guides/setter-and-scanner.md
  - Integrations:
      - Reload configuration with Watcher: integrations/watcher.md
      - Load HashiCorp Vault secrets: integrations/vault.md
      - Write a custom resolver: integrations/custom-resolvers.md
  - Tooling:
      - Generate configuration documentation: tooling/fuda-doc.md
  - Reference:
      - Tags: reference/tags.md
      - Builder options: reference/builder-options.md
      - Loading behaviour: reference/loading-behaviour.md
      - Errors: reference/errors.md
      - Troubleshooting: reference/troubleshooting.md

exclude_docs: |
  /config-watcher.md
  /custom-resolvers.md
  /setter-scanner.md
  /tag-spec.md
  /user-guide.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
